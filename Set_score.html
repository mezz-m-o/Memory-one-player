<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>set score</title>
    <style>
        body{
            background-color: #202020;
            color: #ffffff;
        }
        #setScore{
            display: none;
        }
        #a1{
            color: blue;
        }
        .bs{
            border: 0.2pc double #008000;
            border-radius: 2px;
            color: #0000ff;
        }
        .is{
            border: 0.2pc double #373737;
            border-radius: 6px;
        }
    </style>
    <script src="Set_score.js" defer></script>
</head>
<body>
    <div id="pass">
        <h1>enter password to set score or <a id="a1" href="index.html">go back</a></h1>
        <label for="password">password</label>
        <input id="password" class="is" type="password"><button id="submitButton" class="bs">submit</button>
        <p id="label"></p>
    </div>
    <div id="setScore">
        <h1>set score</h1>
        <label for="score">set score</label>
        <input id="score" class="is" type="number"><button id="saveButton" class="bs">save</button><br>
        <label for="resetButton">reset score</label>
        <button id="resetButton" class="bs">reset score</button>
    </div>
</body>
</html>
